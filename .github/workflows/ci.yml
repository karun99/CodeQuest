name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Lint every PHP file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; fail=1; }
          done < <(git ls-files '*.php')
          exit "$fail"
      - name: Run test suite
        run: php tests/run.php

  schema:
    name: Schema sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: schema.sql defines the expected tables
        run: |
          set -euo pipefail
          for t in admins candidates case_studies questions exams \
                   exam_questions attempts attempt_answers attempt_violations \
                   settings import_log; do
            grep -qiE "CREATE TABLE( IF NOT EXISTS)? +$t\b" schema.sql \
              || { echo "::error::schema.sql is missing table $t"; exit 1; }
          done
          echo "schema.sql declares all expected tables"
